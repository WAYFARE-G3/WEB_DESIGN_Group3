# ================================================
# application.properties - Cấu hình chung
# ================================================

spring.application.name=wayfare-backend
server.port=8080

# ------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------
# Hiện SQL được thực thi ra console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL + parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------
# JWT Configuration
# ------------------------------------------------
# Secret key (nên thay bằng giá trị ngẫu nhiên an toàn trong production)
app.jwt.secret=WayFare2024SuperSecretKeyForJWTGenerationPleaseChangeInProduction
# Thời gian hết hạn token: 24 giờ (tính bằng milliseconds)
app.jwt.expiration=86400000

# ------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ------------------------------------------------
# Logging
# ------------------------------------------------
logging.level.com.wayfare=DEBUG
