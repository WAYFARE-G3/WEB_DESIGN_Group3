# ================================================
# application-dev.properties - Profile: Development
# Dùng MySQL với dữ liệu thật
# ================================================

# ------------------------------------------------
# MySQL DataSource
# ------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/wayfare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=sa
spring.datasource.password=$Binh6112005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------
# Connection Pool (HikariCP - mặc định của Spring Boot)
# ------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------
# Hibernate DDL
# ------------------------------------------------
# update: tự cập nhật schema khi có thay đổi Entity (KHÔNG dùng ở production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false
