<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Manage Tours · Wayfare</title>
  <meta name="description" content="Admin panel to create, edit and manage tours.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Admin layout ── */
    .admin-layout { display: flex; min-height: 100vh; }

    .admin-sidebar {
      width: 16rem;
      background: var(--foreground);
      color: white;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .admin-sidebar__brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 1.25rem 1.25rem;
      border-bottom: 1px solid oklch(1 0 0 / 0.1);
      text-decoration: none;
      color: white;
    }
    .admin-sidebar__brand-logo {
      width: 2rem; height: 2rem;
      background: var(--primary);
      border-radius: 0.5rem;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .admin-sidebar__brand-text { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
    .admin-sidebar__badge {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em;
      background: var(--primary); color: white;
      padding: 0.1rem 0.45rem; border-radius: 0.25rem; margin-left: auto;
    }
    .admin-sidebar__nav { padding: 0.75rem 0.75rem; flex: 1; }
    .admin-sidebar__label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: oklch(1 0 0 / 0.4); padding: 0.5rem 0.5rem 0.25rem;
    }
    .admin-nav-item {
      display: flex; align-items: center; gap: 0.625rem;
      padding: 0.625rem 0.75rem; border-radius: var(--radius-md);
      color: oklch(1 0 0 / 0.7); font-size: 0.875rem; font-weight: 500;
      text-decoration: none; transition: background-color 0.15s, color 0.15s;
      margin-bottom: 0.125rem;
    }
    .admin-nav-item:hover, .admin-nav-item.active {
      background: oklch(1 0 0 / 0.1); color: white;
    }
    .admin-sidebar__footer {
      padding: 0.75rem; border-top: 1px solid oklch(1 0 0 / 0.1);
    }
    .admin-back-link {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem; border-radius: var(--radius-md);
      color: oklch(1 0 0 / 0.5); font-size: 0.8rem;
      text-decoration: none; transition: color 0.15s;
    }
    .admin-back-link:hover { color: white; }

    /* ── Main content ── */
    .admin-main { flex: 1; background: var(--background); overflow-y: auto; }
    .admin-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; background: var(--card);
      border-bottom: 1px solid var(--border); gap: 1rem;
    }
    .admin-topbar__title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; margin: 0; }
    .admin-content { padding: 2rem; }

    /* ── Table ── */
    .admin-table-wrap {
      background: var(--card); border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card); overflow: hidden;
    }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th {
      background: var(--muted); padding: 0.75rem 1rem;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted-foreground);
      text-align: left; border-bottom: 1px solid var(--border);
    }
    .admin-table td {
      padding: 0.875rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.875rem; vertical-align: middle;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: var(--muted); }
    .admin-table__thumb {
      width: 3.5rem; height: 2.5rem; border-radius: var(--radius-md);
      object-fit: cover;
    }
    .admin-table__title { font-weight: 600; color: var(--foreground); }
    .admin-table__meta { font-size: 0.75rem; color: var(--muted-foreground); }

    .badge-active { background: oklch(0.72 0.18 145 / 0.15); color: oklch(0.45 0.18 145); padding: 0.2rem 0.65rem; border-radius: 2rem; font-size: 0.72rem; font-weight: 700; }
    .badge-inactive { background: oklch(0.6 0.22 25 / 0.12); color: var(--destructive); padding: 0.2rem 0.65rem; border-radius: 2rem; font-size: 0.72rem; font-weight: 700; }

    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: var(--radius-md);
      border: 1px solid var(--border); background: transparent;
      cursor: pointer; color: var(--muted-foreground);
      transition: background-color 0.12s, color 0.12s, border-color 0.12s;
    }
    .btn-icon:hover { background: var(--muted); color: var(--foreground); border-color: var(--foreground); }
    .btn-icon--danger:hover { background: oklch(0.6 0.22 25 / 0.08); color: var(--destructive); border-color: var(--destructive); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: oklch(0 0 0 / 0.45);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 1rem; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--card); border-radius: var(--radius-xl);
      box-shadow: var(--shadow-elevated); width: 100%; max-width: 42rem;
      max-height: 90vh; overflow-y: auto;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); gap: 1rem;
    }
    .modal-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; margin: 0; }
    .modal-close {
      width: 2rem; height: 2rem; border-radius: var(--radius-md);
      border: 1px solid var(--border); background: transparent;
      cursor: pointer; display: grid; place-items: center;
      color: var(--muted-foreground); transition: background-color 0.12s;
    }
    .modal-close:hover { background: var(--muted); }
    .modal-body { padding: 1.5rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.75rem; justify-content: flex-end; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 576px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); margin-bottom: 0.375rem; }
    .form-control-admin {
      width: 100%; padding: 0.6rem 0.85rem; border: 1.5px solid var(--border);
      border-radius: var(--radius); font-family: inherit; font-size: 0.9rem;
      background: var(--card); color: var(--foreground);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control-admin:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px oklch(0.585 0.18 258 / 0.15); }
    textarea.form-control-admin { resize: vertical; min-height: 5rem; }

    /* Alert toast */
    .toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast {
      padding: 0.875rem 1.25rem; border-radius: var(--radius); font-size: 0.875rem; font-weight: 600;
      box-shadow: var(--shadow-elevated); animation: slideIn 0.25s ease;
    }
    .toast--success { background: oklch(0.72 0.18 145); color: white; }
    .toast--error { background: var(--destructive); color: white; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Access denied */
    .access-denied { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; gap: 1rem; }
  </style>
</head>
<body class="site" data-page="admin-tours">

<div class="admin-layout">
  <!-- ── Sidebar ── -->
  <aside class="admin-sidebar">
    <a href="index.html" class="admin-sidebar__brand">
      <span class="admin-sidebar__brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      </span>
      <span class="admin-sidebar__brand-text">Wayfare</span>
      <span class="admin-sidebar__badge">ADMIN</span>
    </a>
    <nav class="admin-sidebar__nav">
      <div class="admin-sidebar__label">Content</div>
      <a href="admin-tours.html" class="admin-nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        Tours
      </a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="index.html" class="admin-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back to Site
      </a>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="admin-main">
    <!-- Access denied screen -->
    <div class="access-denied" id="accessDenied" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--destructive);opacity:.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      <h1 style="font-size:1.5rem;">Access Denied</h1>
      <p style="color:var(--muted-foreground);">You need to be logged in as an <strong>Admin</strong> to access this page.</p>
      <a href="login.html" class="btn-cta">Go to Login</a>
    </div>

    <!-- Admin content -->
    <div id="adminContent" style="display:none;">
      <div class="admin-topbar">
        <h1 class="admin-topbar__title">Manage Tours</h1>
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <span id="adminUserBadge" style="font-size:0.8rem;color:var(--muted-foreground);"></span>
          <button class="btn-cta btn-cta--sm" id="btnAddTour" onclick="openModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add New Tour
          </button>
        </div>
      </div>

      <div class="admin-content">
        <!-- Stats -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;" id="statsRow">
          <div class="profile-card" style="background:var(--card);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:1.25rem;">
            <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-foreground);margin-bottom:.375rem;">Total Tours</div>
            <div style="font-size:2rem;font-weight:800;font-family:var(--font-display);color:var(--primary);" id="statTotal">—</div>
          </div>
          <div style="background:var(--card);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:1.25rem;">
            <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-foreground);margin-bottom:.375rem;">Active Tours</div>
            <div style="font-size:2rem;font-weight:800;font-family:var(--font-display);color:oklch(0.55 0.18 145);" id="statActive">—</div>
          </div>
          <div style="background:var(--card);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:1.25rem;">
            <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-foreground);margin-bottom:.375rem;">Hidden Tours</div>
            <div style="font-size:2rem;font-weight:800;font-family:var(--font-display);color:var(--destructive);" id="statHidden">—</div>
          </div>
        </div>

        <!-- Table -->
        <div class="admin-table-wrap">
          <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
            <span style="font-weight:700;font-size:0.95rem;">All Tours</span>
            <input type="text" id="searchInput" placeholder="Search by title..." class="form-control-admin" style="max-width:18rem;" oninput="filterTable()">
          </div>
          <div style="overflow-x:auto;">
            <table class="admin-table" id="toursTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Tour</th>
                  <th>Price</th>
                  <th>Duration</th>
                  <th>Slots</th>
                  <th>Rating</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="toursTableBody">
                <tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--muted-foreground);">Loading tours...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Create/Edit Modal ── -->
<div class="modal-overlay" id="tourModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Add New Tour</h2>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="tourForm" onsubmit="submitTour(event)">
        <input type="hidden" id="editingId">

        <div class="form-group">
          <label for="tourTitle">Title *</label>
          <input type="text" id="tourTitle" class="form-control-admin" placeholder="e.g. Ha Long Bay 2-Day Cruise" required>
        </div>

        <div class="form-group">
          <label for="tourDescription">Description</label>
          <textarea id="tourDescription" class="form-control-admin" placeholder="Tour description..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tourPrice">Price (VND) *</label>
            <input type="number" id="tourPrice" class="form-control-admin" placeholder="e.g. 3500000" min="0" step="1000" required>
          </div>
          <div class="form-group">
            <label for="tourImageUrl">Image URL</label>
            <input type="text" id="tourImageUrl" class="form-control-admin" placeholder="assets/halong.jpg">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tourDays">Duration (Days) *</label>
            <input type="number" id="tourDays" class="form-control-admin" min="1" placeholder="e.g. 3" required>
          </div>
          <div class="form-group">
            <label for="tourNights">Duration (Nights)</label>
            <input type="number" id="tourNights" class="form-control-admin" min="0" placeholder="auto if empty">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tourMaxCapacity">Max Capacity</label>
            <input type="number" id="tourMaxCapacity" class="form-control-admin" min="1" placeholder="e.g. 20">
          </div>
          <div class="form-group">
            <label for="tourSlots">Available Slots</label>
            <input type="number" id="tourSlots" class="form-control-admin" min="0" placeholder="defaults to max capacity">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tourDestination">Destination *</label>
            <select id="tourDestination" class="form-control-admin" required>
              <option value="">Loading destinations...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tourCategory">Category</label>
            <select id="tourCategory" class="form-control-admin">
              <option value="">No category</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-outline-nav" onclick="closeModal()">Cancel</button>
      <button type="submit" form="tourForm" class="btn-cta" id="submitBtn">Create Tour</button>
    </div>
  </div>
</div>

<!-- ── Toast container ── -->
<div class="toast-container" id="toastContainer"></div>

<script src="assets/js/api.js"></script>
<script>
  const API = 'http://localhost:8080/api';
  let allTours = [];
  let destinations = [];
  let categories = [];

  // ── Auth gate ──
  function checkAuth() {
    const user = getCurrentUser();
    if (!user || user.role !== 'ADMIN') {
      document.getElementById('accessDenied').style.display = 'flex';
      return false;
    }
    document.getElementById('adminContent').style.display = 'block';
    document.getElementById('adminUserBadge').textContent = `Logged in as: ${user.fullName || user.username}`;
    return true;
  }

  // ── Data loading ──
  async function loadTours() {
    try {
      const token = localStorage.getItem('authToken');
      const res = await fetch(`${API}/tours/all`, {
        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
      });
      allTours = await res.json();
      renderTable(allTours);
      updateStats(allTours);
    } catch (e) {
      showToast('Failed to load tours', 'error');
    }
  }

  async function loadDestinations() {
    try {
      const res = await fetch(`${API}/destinations`);
      if (res.ok) {
        destinations = await res.json();
        const sel = document.getElementById('tourDestination');
        sel.innerHTML = '<option value="">Select destination</option>' +
          destinations.map(d => `<option value="${d.id}">${d.name}, ${d.country}</option>`).join('');
      }
    } catch (e) {
      // Silently use fallback
    }
  }

  async function loadCategories() {
    try {
      const res = await fetch(`${API}/categories`);
      if (res.ok) {
        categories = await res.json();
        const sel = document.getElementById('tourCategory');
        sel.innerHTML = '<option value="">No category</option>' +
          categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
    } catch (e) {}
  }

  // ── Stats ──
  function updateStats(tours) {
    const active = tours.filter(t => t.isActive).length;
    document.getElementById('statTotal').textContent = tours.length;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statHidden').textContent = tours.length - active;
  }

  // ── Table render ──
  function renderTable(tours) {
    const tbody = document.getElementById('toursTableBody');
    if (!tours.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--muted-foreground);">No tours found.</td></tr>';
      return;
    }
    const fmt = n => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);
    tbody.innerHTML = tours.map(t => `
      <tr>
        <td style="color:var(--muted-foreground);font-size:.8rem;">${t.id}</td>
        <td>
          <div style="display:flex;align-items:center;gap:.75rem;">
            <img src="${t.imageUrl || 'assets/halong.jpg'}" alt="" class="admin-table__thumb" onerror="this.src='assets/halong.jpg'">
            <div>
              <div class="admin-table__title">${t.title}</div>
              <div class="admin-table__meta">${t.destination?.name || '—'} · ${t.category?.name || 'No category'}</div>
            </div>
          </div>
        </td>
        <td>${fmt(t.price)}</td>
        <td>${t.durationDays}D / ${t.durationNights ?? '—'}N</td>
        <td>${t.availableSlots ?? '—'} / ${t.maxCapacity ?? '—'}</td>
        <td>
          <div style="display:flex;align-items:center;gap:.25rem;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--star)" stroke="var(--star)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            ${t.averageRating ?? '0.00'}
          </div>
        </td>
        <td><span class="${t.isActive ? 'badge-active' : 'badge-inactive'}">${t.isActive ? 'Active' : 'Hidden'}</span></td>
        <td>
          <div style="display:flex;gap:.375rem;">
            <button class="btn-icon" title="Edit" onclick="openEditModal(${t.id})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            ${t.isActive
              ? `<button class="btn-icon btn-icon--danger" title="Delete" onclick="toggleTour(${t.id}, true)">
                   <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                 </button>`
              : `<button class="btn-icon" title="Restore" onclick="toggleTour(${t.id}, false)">
                   <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                 </button>`}
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderTable(allTours.filter(t => t.title.toLowerCase().includes(q)));
  }

  // ── Modal ──
  function openModal(tour = null) {
    document.getElementById('editingId').value = '';
    document.getElementById('tourForm').reset();
    document.getElementById('modalTitle').textContent = 'Add New Tour';
    document.getElementById('submitBtn').textContent = 'Create Tour';
    document.getElementById('tourModal').classList.add('open');
  }

  function openEditModal(id) {
    const tour = allTours.find(t => t.id === id);
    if (!tour) return;
    document.getElementById('editingId').value = tour.id;
    document.getElementById('tourTitle').value = tour.title || '';
    document.getElementById('tourDescription').value = tour.description || '';
    document.getElementById('tourPrice').value = tour.price || '';
    document.getElementById('tourImageUrl').value = tour.imageUrl || '';
    document.getElementById('tourDays').value = tour.durationDays || '';
    document.getElementById('tourNights').value = tour.durationNights ?? '';
    document.getElementById('tourMaxCapacity').value = tour.maxCapacity || '';
    document.getElementById('tourSlots').value = tour.availableSlots || '';
    if (tour.destination) document.getElementById('tourDestination').value = tour.destination.id;
    if (tour.category) document.getElementById('tourCategory').value = tour.category.id;
    document.getElementById('modalTitle').textContent = 'Edit Tour';
    document.getElementById('submitBtn').textContent = 'Save Changes';
    document.getElementById('tourModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('tourModal').classList.remove('open');
  }

  // Close modal on overlay click
  document.getElementById('tourModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('tourModal')) closeModal();
  });

  // ── Submit ──
  async function submitTour(e) {
    e.preventDefault();
    const editingId = document.getElementById('editingId').value;
    const btn = document.getElementById('submitBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const payload = {
      title: document.getElementById('tourTitle').value,
      description: document.getElementById('tourDescription').value,
      price: parseFloat(document.getElementById('tourPrice').value),
      durationDays: parseInt(document.getElementById('tourDays').value),
      durationNights: document.getElementById('tourNights').value ? parseInt(document.getElementById('tourNights').value) : null,
      maxCapacity: document.getElementById('tourMaxCapacity').value ? parseInt(document.getElementById('tourMaxCapacity').value) : null,
      availableSlots: document.getElementById('tourSlots').value ? parseInt(document.getElementById('tourSlots').value) : null,
      imageUrl: document.getElementById('tourImageUrl').value || null,
      destinationId: parseInt(document.getElementById('tourDestination').value),
      categoryId: document.getElementById('tourCategory').value ? parseInt(document.getElementById('tourCategory').value) : null,
    };

    try {
      const token = localStorage.getItem('authToken');
      const url = editingId ? `${API}/tours/${editingId}` : `${API}/tours`;
      const method = editingId ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': `Bearer ${token}` } : {}) },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      showToast(editingId ? 'Tour updated successfully!' : 'Tour created successfully!', 'success');
      closeModal();
      loadTours();
    } catch (err) {
      showToast('Failed to save tour: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  // ── Soft Delete / Restore ──
  async function toggleTour(id, isCurrentlyActive) {
    const action = isCurrentlyActive ? 'delete' : 'restore';
    if (!confirm(`Are you sure you want to ${action} this tour?`)) return;
    try {
      const token = localStorage.getItem('authToken');
      const method = isCurrentlyActive ? 'DELETE' : 'PATCH';
      const endpoint = isCurrentlyActive ? `${API}/tours/${id}` : `${API}/tours/${id}/toggle`;

      const res = await fetch(endpoint, {
        method: method,
        headers: token ? { 'Authorization': `Bearer ${token}` } : {},
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      showToast(isCurrentlyActive ? 'Tour deleted (hidden).' : 'Tour restored.', 'success');
      loadTours();
    } catch (err) {
      showToast('Failed to ' + action + ': ' + err.message, 'error');
    }
  }

  // ── Toast ──
  function showToast(msg, type = 'success') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast toast--${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // ── Init ──
  if (checkAuth()) {
    loadTours();
    loadDestinations();
    loadCategories();
  }
</script>
